<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const lottoId = params.get("lottoId");
        const assetId = params.get("assetId");
        if (lottoId) {
            window.location.replace(`/lotto/scan?id=${lottoId}`);
        } else if (assetId) {
            window.location.replace(`/asset/scan?id=${assetId}`);
        } else {
            document.write("Errore: Parametri di scansione mancanti o non validi.");
        }
    </script>
</head>
<body>
</body>
</html>
