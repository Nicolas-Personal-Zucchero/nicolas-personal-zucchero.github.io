<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Asset</title>
    <link rel="icon" type="image/png" href="../../static/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="card shadow">
        <h3 id="message">Caricamento...</h3>

        <form id="assetForm" class="d-none mt-3">
            <div class="mb-3">
                <label for="assetNomeInput" class="form-label">Nome</label>
                <input type="text" class="form-control" id="assetNomeInput" readonly required>
            </div>
            <div class="mb-3">
                <label for="tipologiaSelect" class="form-label">Tipologia Intervento</label>
                <select class="form-select" id="tipologiaSelect" required>
                    <option value="Pulizia" selected>Pulizia</option>
                    <option value="Manutenzione">Manutenzione</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="operatoreSelect" class="form-label">Operatore Interno</label>
                <select class="form-select" id="operatoreSelect" required>
                    <option value="" selected>Seleziona operatore</option>
                </select>
            </div>

            <div id="extraFields" class="border p-2 mb-3 bg-light rounded">
                <div class="mb-2">
                    <label for="aziendaEsternaInput" class="form-label">Azienda Esterna</label>
                    <input type="text" class="form-control" id="aziendaEsternaInput" placeholder="Nome azienda">
                </div>
                <div class="mb-2">
                    <label for="operatoreEsternoInput" class="form-label">Nome Operatore Esterno</label>
                    <input type="text" class="form-control" id="operatoreEsternoInput" placeholder="Nome e Cognome">
                </div>
            </div>

            <div class="mb-3">
                <label for="noteInput" class="form-label">Note</label>
                <input type="text" class="form-control" id="noteInput">
            </div>
            <button type="submit" class="btn btn-primary w-100">Registra intervento</button>
        </form>
    </div>

    <script type="module">
        import { doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
        import { db, operatori } from "../../js/firebase-config.js";

        const messageEl = document.getElementById("message");
        const assetForm = document.getElementById("assetForm");
        const assetNome = document.getElementById("assetNomeInput");
        const tipologiaSelect = document.getElementById("tipologiaSelect");
        const operatoreSelect = document.getElementById("operatoreSelect");
        const aziendaEsternaInput = document.getElementById("aziendaEsternaInput");
        const operatoreEsternoInput = document.getElementById("operatoreEsternoInput");
        const noteInput = document.getElementById("noteInput");

        function showMessage(text, type="info") {
            messageEl.innerHTML = `<div class="alert alert-${type}" role="alert">${text}</div>`;
        }

        operatori.forEach(op => operatoreSelect.add(new Option(op, op)));

        const savedOperatore = localStorage.getItem("operatore");
        if (savedOperatore) operatoreSelect.value = savedOperatore;
        operatoreSelect.addEventListener("change", () => localStorage.setItem("operatore", operatoreSelect.value));

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (id) {
            loadAssetForm(id);
        } else {
            showMessage("Indirizzo non corretto! Manca l'Asset ID.", "warning");
        }

        async function loadAssetForm(id) {
            const assetRef = doc(db, "asset", id);
            try {
                const docSnap = await getDoc(assetRef);
                if (!docSnap.exists()) {
                    showMessage("Asset non trovato!", "danger");
                    return;
                }
                const assetData = docSnap.data();
                assetNome.value = assetData.nome;
                
                assetForm.classList.remove("d-none");
                messageEl.innerHTML = "";

                assetForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    
                    const tipologia = tipologiaSelect.value;
                    const operatore = operatoreSelect.value;
                    const aziendaEsterna = aziendaEsternaInput.value;
                    const nomeOperatoreEsterno = operatoreEsternoInput.value;
                    const note = noteInput.value;

                    if (!tipologia || !operatore) {
                        showMessage("Compila tipologia e operatore!", "warning");
                        return;
                    }

                    try {
                        // Creazione oggetto intervento con i nuovi campi
                        const intervento = {
                            operatore, 
                            azienda_esterna: aziendaEsterna || null,
                            operatore_esterno: nomeOperatoreEsterno || null,
                            note, 
                            data: new Date()
                        };

                        if(tipologia === "Pulizia") {
                            await updateDoc(assetRef, {
                                pulizie: arrayUnion(intervento)
                            });
                        } else if(tipologia === "Manutenzione") {
                            await updateDoc(assetRef, {
                                manutenzioni: arrayUnion(intervento)
                            });
                        }
                        
                        showMessage("Intervento registrato con successo!", "success");
                        assetForm.classList.add("d-none");
                    } catch (err) {
                        showMessage(`Errore: ${err.message}`, "danger");
                    }
                    
                    const newUrl = window.location.origin + window.location.pathname;
                    history.replaceState(null, "", newUrl);
                });
            } catch (err) {
                showMessage(`Errore nel recuperare l'asset: ${err.message}`, "danger");
            }
        }
    </script>
</body>
</html>
